# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: container-ctl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: container-ctl
    main: ./cmd/container-ctl
    binary: container-ctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ if .Tag }}{{ .Tag }}{{ else }}v{{ .Version }}-dev{{ end }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - install.sh

nfpms:
  - id: packages
    package_name: container-ctl
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: "container-ctl"
    homepage: "https://github.com/AndreyJVM/container-ctl"
    maintainer: "Andrey Vorobev <andrey.vorobev.aqa@gmail.com>"
    description: "Fast terminal TUI for Docker containers, Compose, and Swarm"
    license: "MIT"
    section: "utils"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin


checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: AndreyJVM
    name: container-ctl
  replace_existing_artifacts: true
  mode: keep-existing
  footer: |
    ## 🚀 Quick Install (Headless Server / No GUI)

    **One-liner installer (auto-detects OS & CPU architecture):**
    ```bash
    wget -qO- https://raw.githubusercontent.com/AndreyJVM/container-ctl/main/install.sh | sudo bash
    ```
    *Or with curl:*
    ```bash
    curl -fsSL https://raw.githubusercontent.com/AndreyJVM/container-ctl/main/install.sh | sudo bash
    ```

    **Direct download via wget for this release (Linux amd64):**
    ```bash
    wget https://github.com/AndreyJVM/container-ctl/releases/download/{{ .Tag }}/container-ctl_{{ .Version }}_linux_amd64.tar.gz
    tar -xzf container-ctl_{{ .Version }}_linux_amd64.tar.gz
    sudo mv container-ctl /usr/local/bin/
    ```

    **Direct download via wget for this release (Linux arm64):**
    ```bash
    wget https://github.com/AndreyJVM/container-ctl/releases/download/{{ .Tag }}/container-ctl_{{ .Version }}_linux_arm64.tar.gz
    tar -xzf container-ctl_{{ .Version }}_linux_arm64.tar.gz
    sudo mv container-ctl /usr/local/bin/
    ```

    **Debian / Ubuntu / Raspberry Pi OS (.deb):**
    ```bash
    wget https://github.com/AndreyJVM/container-ctl/releases/download/{{ .Tag }}/container-ctl_{{ .Version }}_amd64.deb
    sudo dpkg -i container-ctl_{{ .Version }}_amd64.deb
    ```

    **RHEL / CentOS / Rocky Linux / Fedora (.rpm):**
    ```bash
    wget https://github.com/AndreyJVM/container-ctl/releases/download/{{ .Tag }}/container-ctl_{{ .Version }}_amd64.rpm
    sudo rpm -i container-ctl_{{ .Version }}_amd64.rpm
    ```

    **Alpine Linux (.apk):**
    ```bash
    wget https://github.com/AndreyJVM/container-ctl/releases/download/{{ .Tag }}/container-ctl_{{ .Version }}_amd64.apk
    apk add --allow-untrusted container-ctl_{{ .Version }}_amd64.apk
    ```

    ## 🔐 Verify Provenance (SLSA v1.0)
    All binary archives, Linux packages, and checksums are cryptographically attested via GitHub Artifact Attestations.
    Verify any downloaded artifact with the GitHub CLI:
    ```bash
    gh attestation verify <filename> --owner AndreyJVM
    ```

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^Merge pull request'
      - '^Merge branch'
  groups:
    - title: "✨ Features"
      regexp: '^.*?feat(\([^\)]+\))?:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([^\)]+\))?:'
      order: 1
    - title: "⚡ Refactoring & Performance"
      regexp: '^.*?(refactor|perf)(\([^\)]+\))?:'
      order: 2
    - title: "🔧 Maintenance & Other"
      order: 999
