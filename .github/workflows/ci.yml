name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
      - 'commit-template.txt'
      - 'debian/**'
      - 'update-changelog.sh'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
      - 'commit-template.txt'
      - 'debian/**'
      - 'update-changelog.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Check code formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "::error::The following files are not formatted with gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Install revive linter
        run: go install github.com/mgechev/revive@latest

      - name: Run revive linter
        run: revive -config revive.toml ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'

  test:
    name: Test & Build (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Run unit tests with race detector
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Publish coverage summary
        if: runner.os == 'Linux'
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.txt | tail -n 1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 14

      - name: Build binary
        run: go build -v -ldflags="-s -w -X main.version=${{ github.sha }}" -o bin/dockpulse ./cmd/dockpulse

      - name: Verify Unix cross-compilation
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/dockpulse
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/dockpulse
          GOOS=freebsd GOARCH=amd64 go build -o /dev/null ./cmd/dockpulse
